name: E2E Git Source Precache

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  true:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: git-source-precache true
        uses: ./
        with:
          git-source: git
          flutter-version: stable
          cache-sdk: false
          cache-pub: false
          git-source-precache: true

  false:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: git-source-precache false
        uses: ./
        with:
          git-source: git
          flutter-version: stable
          cache-sdk: false
          cache-pub: false
          git-source-precache: false
